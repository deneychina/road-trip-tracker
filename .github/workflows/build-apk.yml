name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @road-trip/shared

      - name: Build web app
        run: npm run build -w road-trip-tracker
        env:
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: apps/web

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore release-keystore.p12 -alias roadtrip -keyalg RSA -keysize 2048 -validity 10000 -storepass roadtrip123 -keypass roadtrip123 -dname "CN=Road Trip Tracker, OU=Dev, O=RoadTrip, L=City, ST=State, C=US"
          echo "KEYSTORE_PATH=$PWD/release-keystore.p12" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=roadtrip123" >> $GITHUB_ENV
          echo "KEY_ALIAS=roadtrip" >> $GITHUB_ENV
          echo "KEY_PASSWORD=roadtrip123" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd apps/web/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: road-trip-tracker-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
